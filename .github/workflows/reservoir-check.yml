name: reservoir-check

on:
  push:
    branches: [main, master, develop]
    paths:
      - "peltiez/content-reservoir/**"
      - "peltiez/scripts/reservoir-check.mjs"
      - "peltiez/package.json"
      - ".github/workflows/reservoir-check.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "peltiez/content-reservoir/**"
      - "peltiez/scripts/reservoir-check.mjs"
      - "peltiez/package.json"
      - ".github/workflows/reservoir-check.yml"
  workflow_dispatch:

jobs:
  reservoir:
    name: content-reservoir check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peltiez
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: peltiez/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Reservoir check
        run: npm run reservoir:check
