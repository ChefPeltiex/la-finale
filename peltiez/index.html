    <script>
      // Kill-switch SW v12 : désinscrit tout SW antérieur + purge caches stale.
      // Une seule passe — flag stocké pour éviter boucle de rechargement.
      (function () {
        try {
          var KEY = 'sw-killswitch-v12';
          if (!('serviceWorker' in navigator)) return;
          if (sessionStorage.getItem(KEY)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadOld = false;
            var ps = regs.map(function (r) {
              if (r.active && r.active.scriptURL && r.active.scriptURL.indexOf('sw.js') !== -1) {
                // SW présent — on tente unregister puis re-register (le nouveau sw.js du build)
                hadOld = true;
                return r.unregister();
              }
              return Promise.resolve();
            });
            return Promise.all(ps).then(function () {
              if (!('caches' in window)) return hadOld;
              return caches.keys().then(function (names) {
                return Promise.all(names.filter(function (n) {
                  return n.indexOf('egor69') !== -1 || n.indexOf('circulai') !== -1;
                }).map(function (n) { return caches.delete(n); }));
              }).then(function () { return hadOld; });
            });
          }).then(function (hadOld) {
            sessionStorage.setItem(KEY, '1');
            if (hadOld) {
              // Un seul reload pour récupérer la version fraîche.
              location.reload();
            }
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
