<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond principal -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Cercle décoratif grand (économie circulaire) -->
  <circle cx="950" cy="315" r="260" fill="none" stroke="#10b981" stroke-width="2" opacity="0.15" />
  <circle cx="950" cy="315" r="200" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.12" />
  <circle cx="950" cy="315" r="140" fill="none" stroke="#34d399" stroke-width="1" opacity="0.10" />

  <!-- Arc circulaire accent -->
  <path d="M 950 55 A 260 260 0 0 1 1185 385" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 950 115 A 200 200 0 0 1 1130 430" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- Flèche recyclage stylisée -->
  <circle cx="950" cy="315" r="55" fill="#10b981" opacity="0.12" />
  <text x="950" y="330" font-family="Arial, sans-serif" font-size="52" fill="#10b981" text-anchor="middle" opacity="0.8">♻</text>

  <!-- Barre accent gauche -->
  <rect x="80" y="180" width="6" height="140" fill="url(#accent)" rx="3" />

  <!-- Titre principal CirculAI -->
  <text x="110" y="265" font-family="Arial Black, Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-2">CirculAI</text>

  <!-- Ligne verte accent sous le titre -->
  <rect x="110" y="282" width="380" height="3" fill="url(#accent)" rx="2" />

  <!-- Sous-titre -->
  <text x="110" y="340" font-family="Arial, sans-serif" font-size="28" fill="#34d399" font-weight="600" letter-spacing="0.5">Économie Circulaire · Québec</text>

  <!-- Description -->
  <text x="110" y="390" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Plateforme d'intelligence circulaire pour</text>
  <text x="110" y="420" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">les municipalités du Québec</text>

  <!-- Auteur -->
  <text x="110" y="480" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Par Dominic Pelletier</text>

  <!-- Pastilles features -->
  <rect x="110" y="520" width="160" height="36" rx="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="190" y="543" font-family="Arial, sans-serif" font-size="14" fill="#34d399" text-anchor="middle">Équation Pilote</text>

  <rect x="285" y="520" width="160" height="36" rx="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="365" y="543" font-family="Arial, sans-serif" font-size="14" fill="#34d399" text-anchor="middle">Plan d'Action</text>

  <rect x="460" y="520" width="160" height="36" rx="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="540" y="543" font-family="Arial, sans-serif" font-size="14" fill="#34d399" text-anchor="middle">Hub Municipal</text>

  <!-- URL -->
  <text x="1170" y="610" font-family="Arial, sans-serif" font-size="16" fill="#475569" text-anchor="end">circulai-demo.vercel.app</text>
</svg>
